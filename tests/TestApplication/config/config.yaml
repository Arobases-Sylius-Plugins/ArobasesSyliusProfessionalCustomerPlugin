imports:
    - { resource: "@ArobasesSyliusProfessionalCustomerPlugin/Resources/config/config.yaml" }
    - { resource: "services_test.php" }

doctrine:
    orm:
        entity_managers:
            default:
                mappings:
                    TestApplication:
                        is_bundle: false
                        type: attribute
                        dir: '%kernel.project_dir%/../../../tests/TestApplication/src/Entity'
                        prefix: Tests\Arobases\SyliusProfessionalCustomerPlugin\Entity

sylius_channel:
    resources:
        channel:
            classes:
                model: Tests\Arobases\SyliusProfessionalCustomerPlugin\Entity\Channel\Channel

sylius_customer:
    resources:
        customer:
            classes:
                model: Tests\Arobases\SyliusProfessionalCustomerPlugin\Entity\Customer\Customer
