name: Build

on:
    push:
        branches-ignore:
            - 'dependabot/**'
    pull_request: ~
    release:
        types: [created]
    workflow_dispatch: ~

jobs:
    tests:
        runs-on: ubuntu-latest

        name: "Sylius ${{ matrix.sylius }}, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}"

        strategy:
            fail-fast: false
            matrix:
                php: ["8.2", "8.3", "8.4"]
                symfony: ["^6.4", "^7.3"]
                sylius: ["~2.3.0"]

        env:
            APP_ENV: test
            DATABASE_URL: "sqlite:///%kernel.project_dir%/var/data.db"

        steps:
            -
                uses: actions/checkout@v4

            -
                name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: "${{ matrix.php }}"
                    extensions: intl
                    tools: flex
                    coverage: none

            -
                name: Restrict Symfony and Sylius versions
                run: |
                    composer config extra.symfony.require "${{ matrix.symfony }}"
                    composer require "sylius/sylius:${{ matrix.sylius }}" --no-update --no-scripts --no-interaction

            -
                name: Install PHP dependencies
                run: composer update --no-interaction --no-scripts

            -
                name: Run ECS
                run: vendor/bin/ecs check

            -
                name: Run PHPStan
                run: vendor/bin/phpstan analyse

            -
                name: Lint the container, templates and Doctrine mapping
                run: |
                    vendor/bin/console cache:clear
                    vendor/bin/console lint:container
                    vendor/bin/console lint:twig src/Resources/views
                    vendor/bin/console lint:yaml src/Resources/config
                    vendor/bin/console doctrine:schema:validate --skip-sync
