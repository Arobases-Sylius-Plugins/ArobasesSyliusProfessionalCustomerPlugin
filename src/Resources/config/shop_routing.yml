arobases_sylius_professional_customer_shop_register:
    path: /pro_register
    methods: [GET, POST]
    defaults:
        _controller: sylius.controller.customer::createAction
        _sylius:
            template: "@ArobasesSyliusProfessionalCustomerPlugin/shop/account/pro_register.html.twig"
            form: Arobases\SyliusProfessionalCustomerPlugin\Form\Type\Customer\CustomerProRegistrationType
            event: register
            redirect:
                route: sylius_shop_register_thank_you
            flash: arobases_sylius_professional_customer.customer.register

arobases_sylius_professional_customer_shop_account_dashboard:
    path: /pro_dashboard
    methods: [GET]
    defaults:
        _controller: sylius.controller.customer::showAction
        _sylius:
            template: "@ArobasesSyliusProfessionalCustomerPlugin/shop/account/pro_dashboard.html.twig"
            repository:
                method: find
                arguments:
                    - "expr:service('sylius.context.customer').getCustomer()"
